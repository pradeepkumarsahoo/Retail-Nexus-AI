# Author: Pradeep Sahoo — Retail Nexus AI
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -q
    --strict-markers
    --strict-config
    --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: marks tests that take more than a second (deselect with '-m "not slow"')
    integration: marks tests that exercise a real external service
    unit: fast, in-process unit tests
filterwarnings =
    ignore::DeprecationWarning
