name: Feature request
description: Suggest an enhancement or new capability.
title: "[feat] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or operational problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - backend / API
        - backend / agents
        - backend / predictive models
        - frontend
        - infra
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of observable outcomes that would close this issue.
    validations:
      required: false
