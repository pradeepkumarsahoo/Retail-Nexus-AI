name: Bug report
description: Report a defect in Retail Nexus AI.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the sections
        below so we can reproduce and fix the issue quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal, deterministic steps to reproduce.
      placeholder: |
        1. Run `make compose-up`.
        2. Call `POST /api/v1/...`.
        3. Observe response ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - backend / API
        - backend / agents
        - backend / predictive models
        - frontend
        - infra / docker
        - infra / terraform
        - docs
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, Node version, Docker version, browser"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces
      render: shell
    validations:
      required: false
